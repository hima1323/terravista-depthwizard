<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DepthWizard Demo</title>
<style>
  :root {
    --bg: #0f1419; --panel: #161c23; --panel-2: #1d252e; --line: #2a343f;
    --text: #e6edf3; --muted: #8b98a5; --accent: #3d9be9; --ok: #4fb286; --err: #e5734a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: grid; grid-template-columns: 290px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  #scenes { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  #scenes li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  #scenes li:hover { background: var(--panel-2); }
  #scenes li.active { background: var(--panel-2); border-color: var(--accent); }
  #scenes img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; background: var(--panel-2); }
  .sname { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sstat { font-size: 12px; color: var(--muted); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  #drop { margin: 10px; padding: 16px; border: 1.5px dashed var(--line); border-radius: 10px; text-align: center; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  #drop.over, #drop:hover { border-color: var(--accent); color: var(--text); }
  main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  header h2 { margin: 0; font-size: 16px; }
  .ttl { margin-right: auto; min-width: 0; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; background: var(--panel-2); border-radius: 8px; padding: 3px; }
  .tabs button { background: none; border: 0; color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .stage { position: relative; min-height: 0; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  #v2d { display: none; place-items: center; padding: 16px 16px 76px; }
  #v2d.on { display: grid; }
  .stage.cardson #v2d { padding-right: 332px; }  /* keep the image clear of the side cards */
  .stage.cardson .controls { right: 332px; }
  .imgwrap { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 1; height: 100%; cursor: crosshair; }
  .imgwrap img, .imgwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; }
  #tip { position: absolute; pointer-events: none; background: rgba(15,20,25,.9); border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; display: none; white-space: nowrap; }
  .controls { position: absolute; left: 16px; bottom: 16px; background: rgba(22,28,35,.92); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .controls label { display: flex; gap: 8px; align-items: center; }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
  .legend { display: flex; align-items: center; gap: 8px; }
  .legend canvas { width: 140px; height: 10px; border-radius: 3px; }
  #pin { position: absolute; pointer-events: none; transform: translate(-50%, -130%); background: var(--accent); color: #fff; padding: 3px 9px; border-radius: 6px; font-size: 13px; font-weight: 600; display: none; white-space: nowrap; }
  #vwait.on { display: grid; } .empty { place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 20px; }
  .note { font-size: 11.5px; color: var(--muted); }
  .cards { position: absolute; right: 16px; top: 16px; bottom: 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 2; pointer-events: none; }
  .cards > * { pointer-events: auto; flex: none; }
  .floodcard { background: rgba(22,28,35,.95); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
  .floodcard button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .floodcard button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .floodcard button:disabled { opacity: .45; cursor: default; }
  .floodcard input[type=number] { width: 54px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; font: inherit; }
  .floodcard .frm { display: grid; gap: 5px; margin: 6px 0 8px; color: var(--muted); }
  .floodcard .frm label { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .floodcard .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .floodcard .msg { color: var(--muted); margin: 4px 0; }
  .floodcard .warn { color: var(--err); }
  .floodcard table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .floodcard th, .floodcard td { text-align: right; padding: 2px 4px; border-top: 1px solid var(--line); font-weight: 400; }
  .floodcard th { color: var(--muted); font-size: 11.5px; }
  .floodcard th:first-child, .floodcard td:first-child { text-align: left; }
  .floodcard .tslide { display: flex; gap: 8px; align-items: center; margin: 8px 0 4px; }
  .floodcard .tslide input { flex: 1; width: auto; }
  .floodcard .site { display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
  .floodcard .site b.tag { color: #111; border-radius: 4px; text-align: center; font-size: 11.5px; padding: 1px 0; }
  .floodcard .site small { grid-column: 2 / 4; margin: 0; }
  .floodcard .keys { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 4px 0; color: var(--muted); font-size: 11.5px; }
  #tchart svg { display: block; width: 100%; height: 84px; }
  .floodcard h3 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .6px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .floodcard .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .floodcard .big span { font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .floodcard .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px solid var(--line); }
  .floodcard .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .floodcard small { color: var(--muted); display: block; margin-top: 8px; line-height: 1.35; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .controls button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .controls button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #hint { position: absolute; left: 16px; top: 16px; max-width: 60%; background: rgba(22,28,35,.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); pointer-events: none; }
  #hint b { color: var(--text); }
  body.clean { grid-template-columns: 1fr; }   /* #clean: presentation mode, 3D / map only */
  .clean main { grid-template-rows: 1fr; }
  .clean aside, .clean header, .clean .controls, .clean .cards, .clean #hint { display: none !important; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
<script type="importmap">

<body>
<aside>
  <div class="brand"><h1>DepthWizard</h1><p>RS3DAda single-image height estimation</p></div>
  <ul id="scenes"></ul>
  <label id="drop">Drop a satellite image here, or click to upload<br><small>PNG · JPG · GeoTIFF (GeoTIFF adds true scale + absolute heights above sea level)</small>
    <input id="file" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff" hidden>
  </label>
</aside>
<main>
  <header>
    <div class="ttl"><h2 id="title">Select a scene</h2><div class="note" id="note"></div></div>
    <div class="stats" id="stats"></div>
    <div class="tabs"><button data-v="v2d" class="on">2D compare</button><button data-v="v3d">3D view</button></div>
  </header>
  <div class="stage">
    <div id="v2d" class="view on">
      <div class="imgwrap" id="wrap"><img id="photo" alt=""><canvas id="heat"></canvas><canvas id="ovl"></canvas><div id="tip"></div></div>
    </div>
    <div id="v3d" class="view"><div id="pin"></div><div id="hint" hidden></div></div>
    <div class="empty view" id="vwait"></div>
    <div class="controls" id="controls">
      <div class="legend" id="floodlegend" hidden><span><i class="sw" style="background:#2f7fe0"></i>Water</span><span><i class="sw" style="background:#e5484d"></i>Submerged</span><span><i class="sw" style="background:#f5a524"></i>Partly flooded</span></div>
      <div class="legend" id="gradlegend"><span id="llo">0 m</span><canvas id="legend" width="140" height="1"></canvas><span id="lmax">–</span></div>
      <label class="c2d">Layer <select id="layer"><option value="height">Height</option><option value="unc">Uncertainty (±)</option><option value="slope" title="Terrain slope from the 30 m terrain model; classes as in BIS IS 14496 (Part 2) landslide hazard zonation">Slope (landslide)</option></select></label>
      <label class="c2d">Overlay <input id="alpha" type="range" min="0" max="1" step="0.01" value="0.65"></label>
      <label class="c3d" hidden>Height ×<input id="exag" type="range" min="1" max="5" step="0.5" value="2"><span id="exagv">2</span></label>
      <label class="c3d" hidden>Surface <select id="tex3d"><option value="photo">Photo</option><option value="heat">Height colours</option><option value="unc">Uncertainty</option><option value="slope">Slope (landslide)</option></select></label>
      <label class="c3d" hidden><input id="spin" type="checkbox"> Auto-orbit</label>
      <label class="c3d" hidden>Camera <select id="cam"><option value="orbit">Orbit</option><option value="fly">Fly (W A S D)</option><option value="street">Street level</option></select></label>
      <span class="c3d" hidden><button id="pathbtn" title="Click points on the 3D scene to plan a route">✎ Draw path</button>
        <button id="playbtn" title="Fly along your route (or an automatic tour if none is drawn)">▶ Fly through</button>
        <button id="recbtn" title="Fly the route and save it as a video file">● Record video</button></span>
      <label id="corrwrap" hidden title="Height correction learned on US LiDAR (DFC2019); not yet verified on Indian cities"><input id="corr" type="checkbox"> Bias correction</label>
      <label><input id="flood" type="checkbox"> Flood</label>
      <button id="routebtn" title="Find a route between two points that avoids buildings, steep ground and deep water">⤳ Route</button>
      <button id="sitebtn" title="Find flat, open, dry places for a helicopter to land or a relief camp">🚁 Relief sites</button>
      <label title="GeoTIFFs open in QGIS / ArcGIS; the 3D model (true metres) in Blender or any glTF viewer">Download <select id="dl"><option value="">…</option><option value="glb">3D model (.glb)</option>
        <option value="_dsm.tif">DSM, m a.s.l. (.tif)</option><option value="_dtm.tif">Terrain DTM (.tif)</option>
        <option value="_height.tif">Height above ground (.tif)</option><option value="_uncertainty.tif">Uncertainty ± (.tif)</option>
        <option value="_buildings.json">Building blocks (.json)</option></select></label>
      <label class="cflood" hidden>Water level <input id="depth" type="range" min="0" max="15" step="any" value="3"><span id="depthv">3.0 m</span></label>
      <label class="cflood" hidden title="All low ground: everything below the water level floods. Scene edges: water comes in from outside the image (river, sea) and floods only ground it can flow to. Points I click: water spreads from the points you place.">Water from
        <select id="fsrc"><option value="all">all low ground</option><option value="edges">scene edges</option><option value="pick">points I click</option></select></label>
      <button class="cflood" id="timebtn" hidden title="How the flood develops if rain continues or the river keeps rising">⏱ Timeline</button>
    </div>
    <div class="cards" id="cards">
      <div class="floodcard" id="floodcard" hidden></div>
      <div class="floodcard" id="routecard" hidden>
        <h3>Route finder</h3>
        <div class="frm">
          <label>Travel <select id="rmode"><option value="foot">On foot</option><option value="car">Car</option></select>
            <span title="Water deeper than this blocks the route">max water <input id="rdepth" type="number" min="0" max="3" step="0.05" value="0.5"> m</span></label>
          <label title="Count buildings with at least one floor above the water as safe places (vertical evacuation)"><input id="rbuild" type="checkbox" checked> Tall buildings count as safe places</label>
        </div>
        <div class="btns"><button id="rpickA">Set A</button><button id="rpickB">Set B</button>
          <button id="rsafe" title="Nearest place from A that is at least 1 m above the water, or a building with a dry floor">Nearest safe place</button>
          <button id="rfly" title="Fly along the route at street level">▶ Fly</button><button id="rclear">Clear</button></div>
        <div id="rout" class="msg"></div>
      </div>
      <div class="floodcard" id="sitecard" hidden>
        <h3>Helipad &amp; relief camp finder</h3>
        <div class="frm">
          <label title="Rule of thumb (ICAO): a landing area at least 1.5 × the helicopter's overall length with rotors turning: about 24 m for an ALH Dhruv, about 38 m for a Mi-17. Confirm with the air wing.">Helipad clear circle <input id="spad" type="number" min="10" max="100" step="1" value="25"> m</label>
          <label>Camp area at least <input id="scamp" type="number" min="100" step="100" value="1000"> m²</label>
          <label title="Sphere humanitarian standard: at least 45 m² of usable site area per person in a camp, including shelters, paths and services">Space per person <input id="sper" type="number" min="5" step="5" value="45"> m²</label>
          <label>Max slope <input id="sslope" type="number" min="0" max="20" step="0.5" value="5">° · dry by <input id="sdry" type="number" min="0" max="5" step="0.1" value="0.5"> m</label>
          <label id="stlwrap" hidden><input id="stl" type="checkbox" checked> Must stay dry for the whole timeline</label>
        </div>
        <div id="sout"></div>
      </div>
      <div class="floodcard" id="timecard" hidden>
        <h3>Rain &amp; rise timeline</h3>
        <div class="frm">
          <label>Rain <input id="train" type="number" min="0" max="300" step="1" value="15"> mm/h for <input id="thours" type="number" min="0" max="384" step="1" value="12"> h</label>
          <label><button id="tfc" title="Hourly rain forecast for this location from Open-Meteo (needs internet and a GeoTIFF scene)">Use rain forecast</button><span id="tfcinfo"></span></label>
          <label title="Water coming from outside the image: a river or the sea rising (read off a gauge trend or a CWC forecast). Negative = falling.">River / outside rise <input id="trise" type="number" step="0.1" value="0"> m/day</label>
          <label title="Rain the storm drains can carry away. Indian city drains are typically designed for about 25–50 mm/h.">Drains carry away <input id="tdrain" type="number" min="0" step="5" value="25"> mm/h</label>
          <label title="Rain that falls uphill / upstream and flows into this scene. 1 = only the rain falling on this image.">Area draining here <input id="tup" type="number" min="1" step="0.5" value="1"> × scene</label>
          <label>Simulate <input id="tdays" type="number" min="1" max="16" step="1" value="3"> days</label>
        </div>
        <label class="tslide">Time <input id="tt" type="range" min="0" max="72" step="1" value="0"><span id="ttv">now</span></label>
        <label><input id="tarr" type="checkbox"> Show “time until flooded” map</label>
        <div class="keys" id="tkeys" hidden></div>
        <div id="tchart"></div>
        <div id="tout"></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const $ = id => document.getElementById(id);
let scenes = [], current = null, data = null;   // data = {name, meta, grid, heatCanvas, photo}

// Turbo colormap (Google, polynomial approximation)
function turbo(x) {
  x = Math.min(1, Math.max(0, x));
  const r = 0.13572138 + x*(4.61539260 + x*(-42.66032258 + x*(132.13108234 + x*(-152.94239396 + x*59.28637943))));
  const g = 0.09140261 + x*(2.19418839 + x*(4.84296658 + x*(-14.18503333 + x*(4.27729857 + x*2.82956604))));
  const b = 0.10667330 + x*(12.64194608 + x*(-60.58204836 + x*(110.36276771 + x*(-89.90310912 + x*27.34824973))));
  return [r, g, b].map(v => Math.round(Math.min(1, Math.max(0, v)) * 255));
}
// Uncertainty ramp (inferno-like: dark → purple → orange → yellow), distinct from the height ramp
function inferno(x) {
  const S = [[0,0,4],[87,16,110],[188,55,84],[249,142,9],[252,255,164]];
  x = Math.min(1, Math.max(0, x)) * (S.length - 1);
  const i = Math.min(S.length - 2, Math.floor(x)), f = x - i;
  return S[i].map((v, k) => Math.round(v + (S[i + 1][k] - v) * f));
}
// Terrain slope classes (degrees) as in BIS IS 14496 (Part 2) landslide hazard zonation
const SLOPE_CLASSES = [[15, 'very gentle', [46, 160, 67]], [25, 'gentle', [166, 206, 57]], [35, 'moderately steep', [255, 214, 10]],
                       [45, 'steep', [247, 127, 0]], [Infinity, 'escarpment / cliff', [214, 40, 40]]];
const slopeClass = d => SLOPE_CLASSES.find(([t]) => d <= t);
const slopeRamp = x => slopeClass(x * 50)[2];   // x = slope / 50°
function slopeGrid(z, W, H, dx, dy) {           // degrees, central differences on the terrain grid
  const s = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const xl = Math.max(0, x - 1), xr = Math.min(W - 1, x + 1), yu = Math.max(0, y - 1), yd = Math.min(H - 1, y + 1);
    const gx = (z[y * W + xr] - z[y * W + xl]) / ((xr - xl) * dx), gy = (z[yd * W + x] - z[yu * W + x]) / ((yd - yu) * dy);
    s[y * W + x] = Math.atan(Math.hypot(gx, gy)) * 180 / Math.PI;
  }
  return s;
}
function drawLegend(ramp, lo, hi) {
  const c = $('legend').getContext('2d');
  for (let i = 0; i < 140; i++) { c.fillStyle = `rgb(${ramp(i/139)})`; c.fillRect(i, 0, 1, 1); }
  $('llo').textContent = lo; $('lmax').textContent = hi;
}
function colourCanvas(values, w, h, ramp, vmax) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h);
  values.forEach((v, i) => { const [r, g, b] = ramp(v / vmax); img.data.set([r, g, b, 255], i * 4); });
  ctx.putImageData(img, 0, 0);
  return cv;
}

// ---------- scene list ----------
async function poll() {
  try { scenes = await (await fetch('/api/scenes')).json(); } catch { return; }
  const ul = $('scenes');
  ul.innerHTML = '';
  for (const s of scenes) {
    const li = document.createElement('li');
    li.className = s.name === current ? 'active' : '';
    const label = s.state === 'done' ? `max ${s.meta.max.toFixed(1)} m · built ${s.meta.built_pct.toFixed(0)}%`
      : s.state === 'running' ? `estimating… ${Math.round(s.progress*100)}%`
      : s.state === 'error' ? `error: ${s.error}` : 'queued';
    li.innerHTML = `<img src="/results/${s.name}.jpg" alt=""><div><div class="sname"></div><div class="sstat">${label}</div>${s.state==='done'?'':`<div class="bar"><i style="width:${s.progress*100}%"></i></div>`}</div>`;
    li.querySelector('.sname').textContent = s.name.replaceAll('_', ' ');
    li.onclick = () => select(s.name);
    ul.append(li);
  }
  const cur = scenes.find(s => s.name === current);
  const want = (location.hash.match(/scene=([\w-]+)/) || [])[1];   // e.g. #3d-flood-scene=shimla_hill_town
  if (!current && scenes.length)
    select(want && scenes.some(s => s.name === want) ? want : (scenes.find(s => s.state === 'done') || scenes[0]).name);
  else if (cur && cur.state === 'done' && (!data || data.name !== current) && loading !== current) select(current);
  else if (cur && cur.state !== 'done') showWait(cur);
}
setInterval(poll, 1500);
poll();

function showWait(s) {
  $('vwait').innerHTML = s.state === 'error' ? `Could not process this image.<br>${s.error}`
    : `Estimating heights for <b>&nbsp;${s.name.replaceAll('_',' ')}&nbsp;</b> — ${Math.round(s.progress*100)}%<br><small>about 4 min per 1024×1024 image on an 8 GB M3; other scenes stay browsable</small>`;
  setView('vwait');
}

let loading = null;   // scene being fetched, so the poll loop does not start a second, racing load
async function select(name) {
  current = name;
  const s = scenes.find(x => x.name === name);
  $('title').textContent = name.replaceAll('_', ' ');
  document.querySelectorAll('#scenes li').forEach((li, i) => li.classList.toggle('active', scenes[i].name === name));

function flightPoints() {  // evenly spaced camera positions on a smooth curve through the route points
  const W = sceneW(), H = sceneH(), S = sceneS();
  const way = nav.path.length > 1 ? nav.path    // no route drawn: a default sweep across the scene
    : [[-0.55, 0.45], [-0.2, 0.28], [0.08, 0.05], [-0.05, -0.25], [0.28, -0.36], [0.55, -0.12]].map(([a, b]) => new THREE.Vector2(a * W, b * H));
  const curve = new THREE.CatmullRomCurve3(way.map(p => new THREE.Vector3(p.x, 0, p.y)), false, 'centripetal');
  const pts = curve.getSpacedPoints(Math.max(2, Math.round(curve.getLength() / (S / 400))));
  // street: at eye level; drone: 12% of the scene size above the roofs. Running max then running mean, so the camera
  // glides over bumps and tall buildings instead of jolting (and never dips below the surface)
  const street = nav.mode === 'street', win = street ? 8 : 25, around = (a, i) => a.slice(Math.max(0, i - win), i + win + 1);
  const top = pts.map(p => street ? streetY(p.x, p.z) : surfaceY(p.x, p.z)), lift = top.map((_, i) => Math.max(...around(top, i)));
  pts.forEach((p, i) => { const s = around(lift, i); p.y = s.reduce((a, b) => a + b) / s.length + (street ? 0 : S * 0.12); });
  return pts;
}

// ---------- connected flooding, route finder, rain & rise timeline ----------
const NEVER = 65535;   // "never floods" in the hour-of-arrival grids
const NX = [1, -1, 0, 0, 1, 1, -1, -1], NY = [0, 0, 1, -1, 1, -1, 1, -1];   // 4 straight neighbours first, then diagonals
// share of rain that runs off, per land-cover class (typical rational-method coefficients), in the order of
// infer_height.LANDCOVER: bareland, rangeland, developed, road, trees, water, agriculture, buildings
const LC_RUNOFF = [0.5, 0.35, 0.8, 0.9, 0.2, 1.0, 0.3, 0.9];
// travel cost per land-cover class (1 = paved road), slope penalty (cost × 1 + slope / s), limits, speed (m/s)
const TRAVEL = {
  foot: { lc: [1.2, 1.3, 1.15, 1, 1.3, Infinity, 1.5, 2], slope: 15, maxSlope: 30, speed: 1.2, depth: 0.5 },
  car:  { lc: [3, 4, 2.5, 1, 2.5, Infinity, 6, 6], slope: 8, maxSlope: 15, speed: 5.5, depth: 0.3 },
};
class MinHeap {   // binary min-heap of grid cells keyed by a float; callers skip stale entries
  constructor() { this.k = new Float64Array(1 << 16); this.v = new Int32Array(1 << 16); this.n = 0; }
  push(key, val) {
    if (this.n === this.k.length) {
      const k = new Float64Array(this.n * 2), v = new Int32Array(this.n * 2);
      k.set(this.k); v.set(this.v); this.k = k; this.v = v;
    }
    let i = this.n++;
    while (i > 0) { const p = (i - 1) >> 1; if (this.k[p] <= key) break; this.k[i] = this.k[p]; this.v[i] = this.v[p]; i = p; }
    this.k[i] = key; this.v[i] = val;
  }
  pop() {         // → cell; this.key = its key
    const top = this.v[0]; this.key = this.k[0];
    const key = this.k[--this.n], val = this.v[this.n];
    let i = 0;
    for (;;) {
      let c = 2 * i + 1;
      if (c >= this.n) break;
      if (c + 1 < this.n && this.k[c + 1] < this.k[c]) c++;
      if (this.k[c] >= key) break;
      this.k[i] = this.k[c]; this.v[i] = this.v[c]; i = c;
    }
    this.k[i] = key; this.v[i] = val;
    return top;
  }
}
function groundGrid() { return data.dtm || data.flat || (data.flat = new Float32Array(data.grid.length)); }
function cellArea() { const m = data.meta; return (m.width * m.gsd / m.grid_w) * (m.height * m.gsd / m.grid_h); }
function curLevel() { return $('flood').checked ? waterLevel() : -Infinity; }

// data.reach[i] = the lowest water level at which cell i is under water. Bathtub: its own ground. Connected: water
// spreads from the sources (scene edges or picked points) and passes a cell once it rises above that cell's ground,
// so reach = the lowest "highest ground on the way" over all paths from a source (priority flood, 4-connected so a
// one-cell embankment is not leaked through diagonally).
function computeReach() {
  const m = data.meta, W = m.grid_w, H = m.grid_h, N = W * H, g = groundGrid(), mode = $('fsrc').value;
  const reach = data.reach = mode === 'all' ? Float32Array.from(g) : new Float32Array(N).fill(Infinity);
  if (mode !== 'all') {
    const heap = new MinHeap(), seed = i => { if (g[i] < reach[i]) { reach[i] = g[i]; heap.push(g[i], i); } };
    if (mode === 'edges') {
      for (let x = 0; x < W; x++) { seed(x); seed((H - 1) * W + x); }
      for (let y = 0; y < H; y++) { seed(y * W); seed(y * W + W - 1); }
    } else for (const i of data.sources) seed(i);
    while (heap.n) {
      const i = heap.pop(), k = heap.key;
      if (k > reach[i]) continue;
      const x = i % W, y = (i - x) / W;
      for (let d = 0; d < 4; d++) {
        const nx = x + NX[d], ny = y + NY[d];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx, nk = Math.max(k, g[j]);
        if (nk < reach[j]) { reach[j] = nk; heap.push(nk, j); }
      }
    }
  }
  const br = data.blockReach = new Float32Array(data.buildings.length + 1).fill(Infinity);   // per block: its lowest cell
  for (let i = 0; i < N; i++) { const id = data.bid[i]; if (id > 0 && reach[i] < br[id]) br[id] = reach[i]; }
  data.vol = null;
}

}

  if (data.tl) { const a = data.tl.arrival[i]; t += a === 0 ? '' : a < NEVER ? ` · timeline: ${fmtWhen(a)}` : ' · timeline: stays dry'; }

if (location.hash.includes('selftest')) setTimeout(() => {
  try {
    const b = data.buildings.reduce((x, y) => (y.area_m2 > x.area_m2 ? y : x));
    const found = buildingAt(b.cx, b.cy), L = waterLevel();
    const txt = found ? buildingText(found, ' | ') : 'no building at centroid';
    const nSub = data.buildings.filter(x => blockState(x, L) === 'sub').length;
    // fly-through: the default drone tour stays above the roofs; street level starts outside buildings, at eye height
    const clear = flightPoints().every(p => p.y > surfaceY(p.x, p.z));
    setCam('street');
    const c = camera.position, street = !blocked(c.x, c.z) && Math.abs(c.y - streetY(c.x, c.z)) < 1e-6 && c.y > surfaceY(c.x, c.z);
    setCam('orbit');
    document.title = `SELFTEST ok=${!!found && txt.startsWith('Block')} fly=${clear} street=${street} blocks=${data.buildings.length} level=${L.toFixed(1)} submerged=${nSub} terrain=${!!data.dtm} :: ${txt} || ${pointText(b.cx, b.cy, ' | ')}`;
    const slopeMax = data.slope ? data.slope.reduce((a, v) => Math.max(a, v), 0) : null;
    document.title += ` slope_max=${slopeMax === null ? 'none' : slopeMax.toFixed(1)}`;
    if (location.hash.includes('glbtest'))     // build the GLB and check its header
      exportGLB().then(async b => { const d = new DataView(await b.arrayBuffer());
        document.title += ` GLB ${d.getUint32(0, true) === 0x46546C67 && d.getUint32(4, true) === 2 ? 'ok' : 'bad'} ${b.size} bytes`; });
    if (location.hash.includes('rectest')) {   // record a 3 s tour and report the video file in the title
      nav.testDur = 3; document.querySelector('.tabs [data-v=v3d]').click(); playPath(true);
      const t = setInterval(() => nav.lastVideo && (clearInterval(t), document.title += ` VIDEO ${nav.lastVideo.type} ${nav.lastVideo.size} bytes`), 200);
    }
    if (location.hash.includes('toolstest')) {   // connected flood, routing, safe place, timeline: invariants + timings
      const W = data.meta.grid_w, H = data.meta.grid_h, g = groundGrid(), ms = [], t0 = performance.now(), lap = () => ms.push(Math.round(performance.now() - t0));
      $('fsrc').value = 'edges'; computeReach(); lap();
      let reachOk = true, reached = 0;
      for (let i = 0; i < W * H; i++) { if (data.reach[i] < Infinity) reached++; if (data.reach[i] < g[i]) reachOk = false; }
      const { f } = travelCost(-Infinity);
      const a = nearestOpen(Math.round(H * 0.1) * W + Math.round(W * 0.1), f), b = nearestOpen(Math.round(H * 0.9) * W + Math.round(W * 0.9), f);
      const r1 = findRoute(a, b, -Infinity); lap();
      const straight = Math.hypot((a % W - b % W) * data.meta.width * data.meta.gsd / W, (Math.floor(a / W) - Math.floor(b / W)) * data.meta.height * data.meta.gsd / H);
      const routeOk = !!r1 && r1.path.every(i => !(data.bid[i] > 0)) && r1.len >= straight - 1e-6 && r1.path[0] === a && r1.path.at(-1) === b;
      const Lw = data.gmin + 2, r2 = findRoute(a, -1, Lw, safeTarget(Lw)); lap();
      const Tb = volumeTable(), Vt = 12345, Lv = levelFor(Tb, Vt, data.gmin), volOk = Math.abs(volAt(Tb, Lv) - Vt) < 1;
      $('flood').checked = true; $('depth').value = 0; updateFlood();
      $('train').value = 60; $('thours').value = 6; $('tdrain').value = 20; $('tup').value = 5;
      $('timebtn').click(); lap();
      const tl = data.tl, mono = tl.Lmax.every((v, i) => !i || v >= tl.Lmax[i - 1]);
      document.title += ` TOOLS reach=${reached}/${W * H} reach_ge_ground=${reachOk} route=${r1 ? Math.round(r1.len) + 'm/' + Math.round(straight) + 'm' : 'none'} route_ok=${routeOk}`
        + ` safe=${r2 ? Math.round(r2.len) + 'm:' + r2.target : 'none'} vol_ok=${volOk} peak=+${(Math.max(...tl.L) - data.gmin).toFixed(2)}m`
        + ` rain_C=${tl.C.toFixed(2)} lmax_mono=${mono} arrived=${tl.arrival.reduce((n, x) => n + (x < NEVER), 0)} blocks_wet=${tl.bArr.reduce((n, x, i) => n + (i > 0 && x < NEVER), 0)} ms=${ms.join('/')}`;
      $('sitebtn').click();   // relief sites at the highest water of the timeline
      const S = data.sites, dxm = data.meta.width * data.meta.gsd / W, dym = data.meta.height * data.meta.gsd / H;
      const padOk = S.pads.every(p => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
          if (Math.hypot((x - p.x) * dxm, (y - p.y) * dym) <= S.R - Math.max(dxm, dym) && S.blocked[y * W + x]) return false; return true; })
        && S.pads.every((p, i) => S.pads.every((q, j) => i === j || Math.hypot((p.x - q.x) * dxm, (p.y - q.y) * dym) >= 2 * S.R - 1e-6));
      const campOk = S.camps.every(c => c.people === Math.floor(c.area / 45) && c.area >= 1000);
      document.title += ` SITES pads=${S.pads.length} pad_ok=${padOk} best_pad=${S.pads[0] ? Math.floor(S.pads[0].clear) + 'm' : '-'} camps=${S.camps.length} camp_ok=${campOk}`
        + ` best_camp=${S.camps[0] ? Math.round(S.camps[0].area) + 'm2/' + S.camps[0].people + 'p/road' + Math.round(S.camps[0].road) + 'm' : '-'} level=${(S.L - data.gmin).toFixed(2)}`;
      if (location.hash.includes('toolsview')) {   // leave the route + "time until flooded" map on screen (screenshots)
        $('routebtn').click(); Object.assign(data.route, { a, b, kind: 'ab' }); setPick(null);
        $('tarr').checked = true; $('tt').value = 6; renderTimelineOut(); applyTime(6); updateRoute();
        document.title += ` ROUTE_AT_6H=${data.route.res ? Math.round(data.route.res.len) + 'm wet ' + Math.round(data.route.res.wetLen) + 'm' : 'blocked'}`;
      }
    }
  } catch (e) { document.title = 'SELFTEST error ' + e; }
}, 4000);

async function upload(file) {
  $('drop').firstChild.textContent = `Uploading ${file.name}…`;
  const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
  const j = await r.json();
  $('drop').firstChild.textContent = r.ok ? 'Drop a satellite image here, or click to upload' : `Upload failed: ${j.error}`;
  if (r.ok) { await poll(); select(j.name); }
}
$('file').onchange = e => e.target.files[0] && upload(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };
</script>
</body>
</html>
